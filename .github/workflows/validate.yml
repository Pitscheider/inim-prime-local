name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Follow the Python that Home Assistant requires (Requires-Python
        # >=3.14.2 since 2026.3), so the tests run against the current release.
        python-version: ["3.14"]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # ruff and mypy are version-pinned so CI lint/type rules match what is
        # validated locally and do not drift when new tool releases add rules.
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest-homeassistant-custom-component \
                      pytest pytest-asyncio pytest-cov aiohttp python-dotenv \
                      "ruff==0.16.9" "mypy==2.1.0"
      - name: Lint
        run: ruff check custom_components
      - name: Type check (strict)
        run: mypy custom_components/inim_prime
      - name: Unit + integration tests (100% coverage)
        run: pytest tests tests_ha --cov=custom_components/inim_prime --cov-report=term-missing -q
